<script>
  // ---------------------------------------------------------------
  // window.storage ポリフィル：Claudeアーティファクト専用のAPIを
  // 通常ブラウザのlocalStorageで再現する（このファイルは通常のSafari/Chromeで
  // 開く前提のスタンドアロンHTMLなので、localStorageの利用はここでは適切）
  // ---------------------------------------------------------------
  (function () {
    function nsKey(key, shared) {
      return (shared ? "shared:" : "personal:") + key;
    }
    window.storage = {
      async get(key, shared) {
        try {
          const raw = localStorage.getItem(nsKey(key, shared));
          if (raw === null) throw new Error("key not found: " + key);
          const value = JSON.parse(raw);
          return { key, value, shared: !!shared };
        } catch (e) {
          throw e;
        }
      },
      async set(key, value, shared) {
        localStorage.setItem(nsKey(key, shared), JSON.stringify(value));
        return { key, value, shared: !!shared };
      },
      async delete(key, shared) {
        localStorage.removeItem(nsKey(key, shared));
        return { key, deleted: true, shared: !!shared };
      },
      async list(prefix, shared) {
        const prefixFull = nsKey(prefix || "", shared);
        const keys = [];
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.startsWith(prefixFull)) {
            keys.push(k.slice((shared ? "shared:" : "personal:").length));
          }
        }
        return { keys, prefix, shared: !!shared };
      },
    };
  })();
</script>

function sireFit(sireKey, surfaceKey, distance) {
  const sire = SIRE_DATA[sireKey];
  if (!sire) return 0;
  const surfaceMatch = sire.surface === "both" ? 1 : sire.surface === surfaceKey ? 1 : -0.6;
  const [dmin, dmax] = sire.distance;
  let distMatch;
  if (distance >= dmin && distance <= dmax) distMatch = 1;
  else {
    const diff = distance < dmin ? dmin - distance : distance - dmax;
    distMatch = diff <= 300 ? 0.3 : diff <= 600 ? -0.2 : -0.6;
  }
  return (surfaceMatch + distMatch) / 2; // 目安レンジ: -1〜+1
}

// 直近成績（着順/着差の履歴、新しい順のカンマ区切り文字列）から近走指数(1〜5)を算出
// フォーマット: "着順/着差/地" のように、3つ目に "地" または "L" を付けると地方競馬(NAR)での走破として評価を割り引く
// 例: "1/0,3/0.8,2/0.3/地" = 前走1着(着差0) → 2走前3着(0.8馬身差) → 3走前2着(0.3馬身差、地方競馬)
// 着差・地方フラグは省略可。"1,3,2" のように着順だけでも入力可能（その場合は着差なしとして扱う）
function marginBonus(position, margin) {
  if (margin === undefined || !Number.isFinite(margin)) return 0;
  if (position === 1) return Math.min(0.6, margin * 0.3); // 大差勝ちほど加点
  if (margin <= 0.3) return 0.3; // 僅差の敗戦は好内容として加点
  if (margin <= 1.0) return 0; // 標準的な着差はニュートラル
  return -Math.min(0.6, (margin - 1.0) * 0.2); // 大差負けは減点
}

// 地方競馬(NAR)での走破は、JRAとのレベル差を考慮してスコアを中立(3)寄りに割り引く
function localRaceDiscount(score) {
  return 3 + (score - 3) * 0.5;
}

function formScore(recentFormStr) {
  const tokens = String(recentFormStr || "")
    .split(/[,、\s]+/)
    .map((s) => s.trim())
    .filter(Boolean);
  if (tokens.length === 0) return null;
  const weights = [1, 0.7, 0.5, 0.35, 0.25];
  const posToScore = (p) => (p === 1 ? 5 : p === 2 ? 4 : p === 3 ? 3.5 : p <= 5 ? 2.5 : 1);
  let wSum = 0;
  let vSum = 0;
  tokens.slice(0, 5).forEach((tok, i) => {
    const [posStr, marginStr, flagStr] = tok.split("/");
    const p = parseInt(posStr, 10);
    if (!Number.isFinite(p) || p <= 0) return;
    const margin = marginStr !== undefined && marginStr !== "" && !/^(地|l|L)$/.test(marginStr) ? parseFloat(marginStr) : undefined;
    // 着差の位置に直接 "地"/"L" が入力された場合（着差を省略して地方フラグだけ付けたケース）にも対応
    const isLocal = /^(地|l|L)$/i.test(flagStr || "") || /^(地|l|L)$/i.test(marginStr || "");
    let entryScore = posToScore(p) + marginBonus(p, margin);
    if (isLocal) entryScore = localRaceDiscount(entryScore);
    const w = weights[i] ?? 0.15;
    wSum += w;
    vSum += entryScore * w;
  });
  return wSum > 0 ? Math.min(5, Math.max(1, vSum / wSum)) : null;
}

// 斤量（負担重量）: レース内の平均斤量との差でボーナス/ペナルティを算出
// 平均より軽い=有利、重い=不利。1kgあたり約0.12ポイントの目安。
function weightBonus(weight, avgWeight) {
  if (!Number.isFinite(weight) || !Number.isFinite(avgWeight)) return 0;
  return Math.min(0.6, Math.max(-0.6, (avgWeight - weight) * 0.12));
}

// 馬体重増減: 大幅な増減はコンディション面のマイナス材料になりやすい
function weightChangeBonus(change) {
  if (!Number.isFinite(change)) return 0;
  const abs = Math.abs(change);
  if (abs <= 4) return 0.1;
  if (abs <= 8) return 0;
  if (abs <= 14) return -0.3;
  return -0.6;
}

// ブリンカー着用: 集中力向上のための装具。着用中はわずかにプラス評価
function blinkersBonus(on) {
  return on ? 0.15 : 0;
}

// 休み明け/中間週数: 2〜8週が最も良い状態とされ、連闘や長期休養明けはマイナス
function restBonus(weeks) {
  if (!Number.isFinite(weeks)) return 0;
  if (weeks < 2) return -0.3;
  if (weeks <= 8) return 0.1;
  if (weeks <= 16) return -0.1;
  return -0.4;
}

// 上がり3F: 前走の後半3F(秒)。速いほどプラス、35.0秒を基準に評価
function last3FBonus(sec) {
  if (!Number.isFinite(sec)) return 0;
  return Math.min(0.5, Math.max(-0.5, (35.0 - sec) * 0.15));
}

// 道悪巧者度・距離実績・コース実績: いずれも自己評価(1〜5)を基準3からの差でボーナス化
function selfRatingBonus(val) {
  if (!Number.isFinite(val)) return 0;
  return (val - 3) * 0.3;
}

// 斤量変化: 前走からの斤量の増減(kg)。増えれば不利、減れば有利
function weightCarriedChangeBonus(change) {
  if (!Number.isFinite(change)) return 0;
  return Math.min(0.4, Math.max(-0.4, -change * 0.15));
}

// 本日の傾向（一時反映）: その日だけの好調枠番・脚質・騎手・血統との一致度でボーナスを算出
// 実戦検証で「複数のボーナスが重なった1頭に過信しすぎて大敗」した例があったため、
// 単純合算ではなく上限(0.6)でキャップし、重なりすぎによる過大評価を防ぐ
function dayTrendBonus(h, dayTrend) {
  if (!dayTrend) return 0;
  let bonus = 0;
  if (dayTrend.favoredWaku && dayTrend.favoredWaku.includes(h.waku)) bonus += 0.3;
  if (dayTrend.favoredStyle && dayTrend.favoredStyle === h.style) bonus += 0.3;
  if (dayTrend.favoredJockey && dayTrend.favoredJockey.trim() && h.jockey.trim() === dayTrend.favoredJockey.trim()) bonus += 0.3;
  if (dayTrend.favoredSire && dayTrend.favoredSire.trim() && h.sire === dayTrend.favoredSire.trim()) bonus += 0.2;
  if (dayTrend.favoredDamSire && dayTrend.favoredDamSire.trim() && h.damSire.trim() === dayTrend.favoredDamSire.trim()) bonus += 0.2;
  return Math.min(0.6, bonus);
}

// ---------- helpers ----------
function toNum(v, fallback = 0) {
  const n = parseFloat(v);
  return Number.isFinite(n) && n > 0 ? n : fallback;
}
function normalizeKey(k) {
  return String(k || "").trim().toLowerCase().replace(/\s+/g, "");
}
function findColumn(row, aliases) {
  const keys = Object.keys(row);
  for (const alias of aliases) {
    const match = keys.find((k) => normalizeKey(k) === normalizeKey(alias));
    if (match) return row[match];
  }
  return undefined;
}
function clamp15(v, fallback = 3) {
  const n = parseInt(v, 10);
  if (!Number.isFinite(n)) return fallback;
  return Math.min(5, Math.max(1, n));
}
function parseStyle(v) {
  const raw = String(v || "").trim();
  return STYLE_ALIASES[raw] || STYLE_ALIASES[raw.toLowerCase()] || "senko";
}

// ---------- pace model (simplified: rating doubles as speed & stamina) ----------
function judgePace(horses) {
  const nigeCount = horses.filter((h) => h.style === "nige").length;
  const front = horses.filter((h) => h.style === "nige" || h.style === "senko");
  const avgFrontRating = front.length ? front.reduce((a, h) => a + h.rating, 0) / front.length : 3;

  if (nigeCount >= 3) return { scenario: "ハイペース", reason: `逃げ馬が${nigeCount}頭で先頭争いが激化しやすい。` };
  if (nigeCount === 0) return { scenario: "スローペース", reason: "逃げ馬不在でハナが緩みやすい。" };
  if (nigeCount === 1 && avgFrontRating <= 3.2) return { scenario: "スローペース", reason: "逃げ馬1頭でプレッシャーが弱く、マイペースになりやすい。" };
  if (nigeCount >= 2 && avgFrontRating >= 3.8) return { scenario: "ハイペース", reason: "先行陣のレベルが高く、競り合いから速い流れになりやすい。" };
  return { scenario: "ミドルペース", reason: "先行争いは標準的で、大きな崩れは起きにくい。" };
}

// 複勝圏内(3着以内)確率をハーヴィル法で概算
function harvilleTop3(weights) {
  const n = weights.length;
  const W = weights.reduce((a, b) => a + b, 0);
  if (W <= 0) return weights.map(() => 0);
  const p1 = weights.map((w) => w / W);
  const p2 = new Array(n).fill(0);
  const p3 = new Array(n).fill(0);
  for (let j = 0; j < n; j++) {
    const wj = weights[j];
    const remJ = W - wj;
    if (remJ <= 0) continue;
    for (let i = 0; i < n; i++) {
      if (i === j) continue;
      p2[i] += (wj / W) * (weights[i] / remJ);
    }
    for (let k = 0; k < n; k++) {
      if (k === j) continue;
      const wk = weights[k];
      const remJK = remJ - wk;
      if (remJK <= 0) continue;
      for (let i = 0; i < n; i++) {
        if (i === j || i === k) continue;
        p3[i] += (wj / W) * (wk / remJ) * (weights[i] / remJK);
      }
    }
  }
  return weights.map((_, i) => Math.min(1, p1[i] + p2[i] + p3[i]));
}

function paceEffect(h, scenario, courseBias = 0, postBias = 0) {
  const isFront = h.style === "nige" || h.style === "senko";
  let scenarioSignal = 0;
  if (scenario === "ハイペース") scenarioSignal = -1;
  else if (scenario === "スローペース") scenarioSignal = 1;
  const wakuNum = h.waku || 1;
  const postPenalty = postBias * (wakuNum - 1) * 0.15; // 外枠ほどマイナス材料
  const combined = scenarioSignal + courseBias - postPenalty;
  return isFront ? combined : -combined;
}

function paceVerdict(h, scenario, courseBias = 0, postBias = 0) {
  const effect = paceEffect(h, scenario, courseBias, postBias);
  if (effect >= 0.6) return { label: "有利", tone: "text-emerald-400" };
  if (effect <= -0.6) return { label: "不利", tone: "text-red-400" };
  return { label: "中立", tone: "text-stone-400" };
}

// EV model: single rating drives softmax win-probability
function computeEV(horses) {
  const valid = horses.filter((h) => h.name.trim() && toNum(h.odds) > 0);
  if (valid.length === 0) return { rows: [], overround: 0 };

  const exps = valid.map((h) => Math.exp(h.rating * TEMPERATURE));
  const expSum = exps.reduce((a, b) => a + b, 0);
  const modelProbs = exps.map((e) => e / expSum);

  const inv = valid.map((h) => 1 / toNum(h.odds));
  const overround = inv.reduce((a, b) => a + b, 0);

  const rows = valid.map((h, i) => {
    const odds = toNum(h.odds);
    const ev = modelProbs[i] * odds;
    return { ...h, odds, modelProb: modelProbs[i], ev };
  });
  rows.sort((a, b) => b.ev - a.ev);
  return { rows, overround };
}

  );
}

function KeibaSimple() {
  const [raceName, setRaceName] = useState("サンプルレース（簡易版）");

    }));
  const [horses, setHorses] = useState(seedHorses);
  const [resultsLog, setResultsLog] = useState([]);
  const [actualResultInput, setActualResultInput] = useState("");
  const RESULTS_LOG_KEY = "keiba-simple:__results_log__";
  const [savedRaces, setSavedRaces] = useState([]);
  const [status, setStatus] = useState("");
  const [showSireRef, setShowSireRef] = useState(false);
  const [showJockeyRef, setShowJockeyRef] = useState(false);
  const [expandedIds, setExpandedIds] = useState(() => new Set());
  const toggleExpanded = (id) =>
    setExpandedIds((prev) => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id);
      else next.add(id);
      return next;
    });
  const fileInputRef = useRef(null);

  const surfaceKey = surface === "ダート" ? "dirt" : "turf";
  const courseInfo = useMemo(
    () => resolveCourseConfig(course, surfaceKey, distance),
    [course, surfaceKey, distance]
  );
  const pace = useMemo(() => judgePace(horses.filter((h) => h.name.trim())), [horses]);
  const evInputHorses = useMemo(() => {
    const validWeights = horses.filter((h) => h.name.trim() && Number.isFinite(h.weight)).map((h) => h.weight);
    const avgWeight = validWeights.length ? validWeights.reduce((a, b) => a + b, 0) / validWeights.length : 55;
    const isWetTrack = trackCondition === "重" || trackCondition === "不良";
    return horses.map((h) => {
      const sFit = sireFit(h.sire, surfaceKey, distance);
      const cScore = classScore(h.horseClass);
      const fScore = formScore(h.recentForm);
      const jScore = jockeyScore(h.jockey);
      const classBonus = (cScore - 3) * 0.4;
      const formBonus = fScore === null ? 0 : (fScore - 3) * 0.5;
      const wBonus = weightBonus(h.weight, avgWeight);
      const jBonus = h.jockey.trim() ? (jScore - 3) * 0.4 : 0;
      const wcBonus = weightChangeBonus(h.weightChange);
      const bBonus = blinkersBonus(h.blinkers);
      const rBonus = restBonus(parseFloat(h.restWeeks));
      const l3Bonus = last3FBonus(parseFloat(h.last3F));
      const mudBonus = isWetTrack ? selfRatingBonus(h.mudApt) : 0;
      const distAptBonus = selfRatingBonus(h.distanceApt);
      const courseAptBonus = selfRatingBonus(h.courseApt);
      const wccBonus = weightCarriedChangeBonus(h.weightCarriedChange);
      const dtBonus = dayTrendBonus(h, dayTrend);
      const effRating = Math.min(
        7,
        Math.max(
          0.5,
          h.rating +
            sFit * 0.6 +
            classBonus +
            formBonus +
            wBonus +
            jBonus +
            wcBonus +
            bBonus +
            rBonus +
            l3Bonus +
            mudBonus +
            distAptBonus +
            courseAptBonus +
            wccBonus +
            dtBonus
        )
      );
      return {
        ...h,
        rating: effRating,
        _sireFit: sFit,
        _classScore: cScore,
        _formScore: fScore,
        _weightBonus: wBonus,
        _jockeyScore: jScore,
        _weightChangeBonus: wcBonus,
        _blinkersBonus: bBonus,
        _restBonus: rBonus,
        _last3FBonus: l3Bonus,
        _mudBonus: mudBonus,
        _distAptBonus: distAptBonus,
        _courseAptBonus: courseAptBonus,
        _wccBonus: wccBonus,
        _dtBonus: dtBonus,
      };
    });
  }, [horses, surfaceKey, distance, trackCondition, dayTrend]);
  const { rows, overround } = useMemo(() => computeEV(evInputHorses), [evInputHorses]);
  const recommendedCount = rows.filter((r) => r.ev > 1).length;

  // 予想着順: 血統・クラス・近走・斤量を反映した評価値に、展開(ペース×コース×枠順)の効果を加味して並べ替え
  const predictedOrder = useMemo(() => {
    const valid = evInputHorses.filter((h) => h.name.trim());
    const withScore = valid.map((h) => {
      const pEffect = paceEffect(h, pace.scenario, courseInfo.bias, courseInfo.postBias);
      const finalScore = h.rating + pEffect * 0.4;
      return { ...h, _paceEffect: pEffect, _finalScore: finalScore };
    });
    withScore.sort((a, b) => b._finalScore - a._finalScore);
    const weights = withScore.map((h) => Math.exp(h._finalScore * 1.3));
    const weightSum = weights.reduce((a, b) => a + b, 0) || 1;
    const top3Probs = harvilleTop3(weights);
    return withScore.map((h, i) => ({
      ...h,
      rank: i + 1,
      _top3Prob: top3Probs[i],
      _winProbSim: weights[i] / weightSum,
    }));
  }, [evInputHorses, pace.scenario, courseInfo.bias, courseInfo.postBias]);

  const RANK_MARK = ["◎", "○", "▲", "△", "△"];

  // 買い方のおすすめ: 「堅実な軸」を必ず出しつつ、期待値(EV)が良ければ妙味情報を追加するバランス型
  function kellyFraction(modelProb, odds) {
    const b = odds - 1;
    if (b <= 0) return 0;
    const f = (b * modelProb - (1 - modelProb)) / b;
    return Math.max(0, Math.min(0.06, f)); // 上限6%でキャップ（過剰ベット防止）
  }

  const betRecommendation = useMemo(() => {
    if (predictedOrder.length < 3) return null;
    const [h1, h2, h3, h4] = predictedOrder;
    const gap12 = h1._winProbSim - h2._winProbSim;
    const gap13 = h1._winProbSim - h3._winProbSim;

    const evAll = rows
      .filter((r) => r.odds > 0)
      .map((r) => ({ ...r, kelly: kellyFraction(r.modelProb, r.odds) }))
      .sort((a, b) => b.ev - a.ev);
    const evPositive = evAll.filter((r) => r.ev > 1);
    const axisRow = rows.find((r) => r.id === h1.id);
    const axisHasEdge = axisRow && axisRow.ev > 1;

    const axisEvNote = axisRow
      ? axisRow.ev > 1
        ? `本命(${h1.name})はオッズ的にも妙味あり（EV${axisRow.ev.toFixed(2)}）`
        : `本命(${h1.name})はオッズ的にはやや割高（過剰人気の可能性、EV${axisRow.ev.toFixed(2)}）`
      : `本命(${h1.name})はオッズ未入力のため期待値を計算できません`;

    // 堅さの判定（実力ベース）：極端な閾値にせず、中庸な基準に戻す
    let confidence, label, tone;
    if (gap12 >= 0.13) {
      confidence = "kata";
      label = "堅い決着が濃厚";
      tone = "text-emerald-400 border-emerald-500";
    } else if (gap13 <= 0.05) {
      confidence = "konsen";
      label = "混戦模様";
      tone = "text-red-400 border-red-500";
    } else {
      confidence = "chukan";
      label = "中間評価（本命は軸、下位も一考の余地）";
      tone = "text-amber-400 border-amber-500";
    }

    const picks = [];

    // --- 1. 堅実な軸：どんな状況でも必ず複勝は提案（見送り一択にはしない） ---
    picks.push({
      type: "複勝（堅実軸）",
      detail: `${h1.name}（複勝圏内目安${(h1._top3Prob * 100).toFixed(0)}%）`,
    });

    // --- 2. 単勝・馬単は「堅い」かつ「妙味も一致」のときだけ、控えめに追加 ---
    if (confidence === "kata" && axisHasEdge) {
      picks.push({ type: "単勝（勝負どころ）", detail: `${h1.name}（本命×妙味が一致）` });
      picks.push({ type: "馬単", detail: `${h1.name} → ${h2.name} / ${h1.name} → ${h3.name}` });
    } else {
      // 堅くない、または妙味が薄い場合はワイドで幅を持たせる
      picks.push({ type: "ワイド", detail: `${h1.name} — ${h2.name} / ${h1.name} — ${h3.name}` });
    }

    // --- 3. 3連複は常に「実力上位3〜4頭」のBOXを基本線として提示 ---
    const boxHorses = [h1, h2, h3, h4].filter(Boolean);
    picks.push({
      type: "3連複BOX（実力上位）",
      detail: boxHorses.map((h) => h.name).join("・"),
    });

    // --- 4. 妙味馬（EV>1）が実力上位と別にいれば、追加の一手として提示（極端に絞らない） ---
    const valueHorse = evPositive.find((r) => r.id !== h1.id);
    if (valueHorse) {
      picks.push({
        type: "妙味の付け足し（ヒモに追加）",
        detail: `${valueHorse.name}（オッズ${valueHorse.odds.toFixed(1)}倍・EV${valueHorse.ev.toFixed(
          2
        )}）を、上のワイド/3連複の相手に加えると回収率が上がりやすい`,
      });
    } else if (evPositive.length === 0) {
      picks.push({
        type: "妙味メモ",
        detail: "EV1.0を超える馬は見当たりません。オッズ通りの決着になりやすい可能性が高いですが、堅実軸の複勝・ワイドは有効です",
      });
    }

    if (dayTrend.upsetProne) {
      picks.push({
        type: "本日の傾向メモ",
        detail: "「配当傾向:波乱」入力中です。単勝一点よりワイド・3連複BOXで幅を持たせるのが無難です",
      });
    }

    return { confidence, label, tone, axisEvNote, picks, h1, h2, h3, bestEVHorse: evPositive[0] || null, evPositive };
  }, [predictedOrder, rows, dayTrend.upsetProne]);

  const INDEX_KEY = STORAGE_PREFIX + "__index__";

  // ストレージのキーは空白/スラッシュ/引用符を含められないため、レース名を安全なキーに変換する
  const toSlug = (name) =>
    name
      .trim()
      .replace(/[\s\/\\'"]+/g, "_")
      .slice(0, 150) || `race_${Date.now()}`;

  const refreshSavedList = useCallback(async () => {
    if (typeof window.storage === "undefined") {
      setSavedRaces([]);
      return;
    }
    try {
      const idxRes = await window.storage.get(INDEX_KEY, false);
      const idx = idxRes && idxRes.value ? JSON.parse(idxRes.value) : {};
      setSavedRaces(Object.entries(idx).map(([slug, label]) => ({ slug, label })));
    } catch (e) {
      setSavedRaces([]);
    }
  }, []);
  useEffect(() => { refreshSavedList(); }, [refreshSavedList]);

  useEffect(() => {
    (async () => {
      if (typeof window.storage === "undefined") return;
      try {
        const res = await window.storage.get(RESULTS_LOG_KEY, false);
        if (res && res.value) setResultsLog(JSON.parse(res.value));
      } catch (e) {
        // ログがまだ無い場合は何もしない
      }
    })();
  }, []);

  const persistResultsLog = async (log) => {
    if (typeof window.storage === "undefined") {
      return { ok: false, reason: "この環境ではアプリ内保存(window.storage)が使えません" };
    }
    try {
      const res = await window.storage.set(RESULTS_LOG_KEY, JSON.stringify(log), false);
      if (!res) return { ok: false, reason: "ストレージが空の応答を返しました" };
      return { ok: true };
    } catch (e) {
      return { ok: false, reason: e && e.message ? e.message : String(e) };
    }
  };

  const recordResult = async () => {
    if (!actualResultInput.trim() || predictedOrder.length === 0) {
      setStatus("実際の着順（1着,2着,3着の馬名など）を入力してください");
      return;
    }
    const actualNames = actualResultInput.split(/[,、\s]+/).map((s) => s.trim()).filter(Boolean);
    const axis = predictedOrder[0];
    const hitTansho = actualNames[0] === axis.name;
    const hitFukusho = actualNames.slice(0, 3).includes(axis.name);
    const entry = {
      id: `log-${Date.now()}`,
      raceName: raceName.trim() || "レース",
      course,
      date: new Date().toISOString(),
      axisName: axis.name,
      actual: actualNames.join(" → "),
      hitTansho,
      hitFukusho,
    };
    const newLog = [entry, ...resultsLog].slice(0, 100);
    setResultsLog(newLog);
    setActualResultInput("");
    const saveResult = await persistResultsLog(newLog);
    if (saveResult.ok) {
      setStatus(`記録・保存しました（${axis.name}：単勝${hitTansho ? "○" : "×"} / 複勝${hitFukusho ? "○" : "×"}）`);
    } else {
      setStatus(
        `画面には記録しましたが、この端末では自動保存ができません。下にバックアップ用のテキストを表示したので、必ずコピーしてメモアプリなどに貼り付けてください。`
      );
      showBackupText();
    }
  };

  const deleteLogEntry = (id) => {
    const newLog = resultsLog.filter((e) => e.id !== id);

      showBackupText();
      return;
    }
    try {
      const slug = toSlug(trimmedName);
      const setResult = await window.storage.set(
        STORAGE_PREFIX + slug,
        JSON.stringify({ raceName: trimmedName, horses, course, distance, surface, trackCondition, dayTrend }),
        false

        setStatus("保存に失敗しました(ストレージが空の応答を返しました)。下に表示したテキストをコピーして保存してください。");

            </div>
            <div className="flex flex-wrap gap-2">
              <button onClick={exportToFile} className="text-xs px-3 py-1.5 border border-amber-600 text-amber-400 hover:bg-amber-500 hover:text-emerald-950">
                ファイルに保存(JSON)
              </button>
              <button onClick={() => importFileInputRef.current && importFileInputRef.current.click()} className="text-xs px-3 py-1.5 border border-emerald-700 text-emerald-300 hover:border-amber-400 hover:text-amber-400">
                ファイルから読込
              </button>
              <input ref={importFileInputRef} type="file" accept=".json,application/json" onChange={handleImportFile} className="hidden" />
            </div>
            <p className="text-[10px] text-emerald-600 pt-1">
              「アプリ内保存」がうまく動かない場合はこちらをお使いください。端末にJSONファイルとしてダウンロードされ、後で読み込んで復元できます。
            </p>
          </div>

          <div className="pt-3 border-t border-emerald-800">
            <div className="text-xs uppercase tracking-wider text-amber-400 font-bold mb-2">
              テキストをコピー&ペーストで保存・読込（最終手段）
            </div>
            <div className="flex flex-wrap gap-2">
              <button
                onClick={() => setShowExportText((s) => !s)}
                className="text-xs px-3 py-1.5 border border-amber-600 text-amber-400 hover:bg-amber-500 hover:text-emerald-950"
              >
                {showExportText ? "テキスト表示を閉じる" : "保存用テキストを表示"}
              </button>
              <button
                onClick={() => setShowImportText((s) => !s)}
                className="text-xs px-3 py-1.5 border border-emerald-700 text-emerald-300 hover:border-amber-400 hover:text-amber-400"
              >
                {showImportText ? "読込欄を閉じる" : "テキストから読込"}
              </button>
            </div>
            {showExportText && (
              <div className="mt-2 space-y-2">
                <textarea
                  ref={exportTextareaRef}
                  readOnly
                  value={exportTextValue}
                  onFocus={(e) => e.target.select()}
                  className="w-full h-32 bg-emerald-950 border border-emerald-800 text-stone-200 text-[10px] tote-mono p-2"
                />
                <div className="flex gap-2">
                  <button
                    onClick={copyExportText}
                    className="text-xs px-3 py-1.5 bg-amber-500 text-emerald-950 font-bold hover:bg-amber-400"
                  >
                    コピー
                  </button>
                  <span className="text-[10px] text-emerald-600 self-center">
                    自動コピーが効かない場合は、テキスト欄を長押しして手動でコピーしてください。
                  </span>
                </div>
              </div>
            )}
            {showImportText && (
              <div className="mt-2 space-y-2">
                <textarea
                  value={importTextValue}
                  onChange={(e) => setImportTextValue(e.target.value)}
                  placeholder="ここに保存しておいたJSONテキストを貼り付けてください"
                  className="w-full h-32 bg-emerald-950 border border-emerald-800 text-stone-200 text-[10px] tote-mono p-2"
                />
                <button
                  onClick={importFromText}
                  className="text-xs px-3 py-1.5 bg-amber-500 text-emerald-950 font-bold hover:bg-amber-400"
                >
                  このテキストから読み込む
                </button>
              </div>
            )}
            <p className="text-[10px] text-emerald-600 pt-1">
              メモアプリなどにこのテキストを貼り付けて保管しておけば、いつでも貼り戻して復元できます。ブラウザの機能に一切依存しません。
            </p>
          </div>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<KeibaSimple />);
</script>
</body>
</html>
