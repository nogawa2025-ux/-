<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b7a5a"/>
      <stop offset="1" stop-color="#022c22"/>
    </linearGradient>
  </defs>
  <!-- 背景（写真判定画像らしい横縞） -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <g fill="#ffffff" opacity="0.06">
    <rect y="96" width="512" height="6"/>
    <rect y="170" width="512" height="3"/>
    <rect y="300" width="512" height="5"/>
    <rect y="384" width="512" height="3"/>
    <rect y="440" width="512" height="6"/>
  </g>
  <!-- 目盛り線 -->
  <g stroke="#ffffff" stroke-width="3" opacity="0.13">
    <line x1="226" y1="0" x2="226" y2="512"/>
    <line x1="122" y1="0" x2="122" y2="512"/>
    <line x1="18" y1="0" x2="18" y2="512"/>
    <line x1="434" y1="0" x2="434" y2="512"/>
  </g>
  <!-- ゴール線 -->
  <rect x="325" y="0" width="10" height="512" fill="#dc2626"/>
  <!-- 馬の首と頭（鼻先がゴール線に届く） -->
  <g transform="translate(330 250) scale(8.4)">
    <path d="M-42,2 Q-30,-13 -16,-17 L-8,-8 Q-20,6 -26,22 L-30,40 L-60,40 L-60,8 Z" fill="#8a4b24"/>
    <path d="M-18,-18 L-16,-26 L-12,-19 Q-5,-14 -0.6,-3 Q0.4,0 -1.5,1.2 L-7,2 Q-14,-2 -20,-9 Z" fill="#8a4b24"/>
    <path d="M-44,0 Q-31,-12 -18,-17.5" fill="none" stroke="#3b1d0b" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-3" cy="-1" rx="3" ry="2.5" transform="rotate(34 -3 -1)" fill="#000" opacity="0.35"/>
    <circle cx="-11" cy="-14" r="1.4" fill="#000"/>
  </g>
  <!-- 拡大鏡 -->
  <circle cx="330" cy="248" r="78" fill="none" stroke="#fbbf24" stroke-width="16"/>
  <line x1="388" y1="306" x2="452" y2="370" stroke="#fbbf24" stroke-width="28" stroke-linecap="round"/>
</svg>
